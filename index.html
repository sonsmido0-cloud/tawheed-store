  --bg:#f7f4ee;--card:#fff;--line:#e6dfd0;--text:#1a1a1a;--muted:#6b6558;--gold:#d9b45a;--ink:#121212;--field:#faf7f0;
  --serif:'Amiri','Traditional Arabic',serif;--sans:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f0f0f;--card:#1a1a1a;--line:#333;--text:#f1ece1;--muted:#a89f8f;--field:#232323;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f0f0f;--card:#1a1a1a;--line:#333;--text:#f1ece1;--muted:#a89f8f;--field:#232323;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.hascart .wrap,.editing .wrap{padding-bottom:110px}
.top{background:var(--ink);color:#f1ece1;border:1px solid var(--gold);border-radius:12px;overflow:hidden;text-align:center}
.hero,.card2{aspect-ratio:1280/698;background:var(--bg1) center/cover no-repeat;background-color:#0b0b0b}
.card2{background-image:var(--bg2);border:1px solid var(--gold);border-radius:12px}
.tin{padding:16px 14px 20px}
h1{font-family:var(--serif);font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold);margin:0 0 12px;line-height:1.3}
.btn{display:inline-block;font:inherit;font-size:.9rem;font-weight:600;text-decoration:none;color:#f1ece1;border:1px solid var(--gold);border-radius:999px;padding:5px 18px;margin:2px}
.btn.gold{background:var(--gold);color:#121212}
.pill{display:block;width:max-content;max-width:100%;margin:22px auto 6px;background:#f3e6bd;color:#1a1a1a;border:1px solid var(--gold);border-radius:999px;padding:6px 28px;font-family:var(--serif);font-weight:700;font-size:1.35rem;text-align:center}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin:0 0 18px}
.grid{display:grid;gap:20px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{margin:0;background:var(--ink);color:var(--gold);font-family:var(--serif);font-size:1.25rem;padding:8px 14px;display:flex;gap:8px;align-items:center}
.cols,.row{display:grid;grid-template-columns:1fr 7.5em;gap:8px;padding:9px 14px;align-items:center}
.cols{background:#f0ead9;color:#1a1a1a;font-weight:600;font-size:.85rem;border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cols{background:#262626;color:#d9cfb8}}
.row{border-bottom:1px solid var(--line)}
button.row{width:100%;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;cursor:pointer}
button.row:active{background:var(--field)}
.pr{font-weight:600;font-size:1.05rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.pr.na{color:var(--muted);font-weight:400;font-size:.88rem}
.plus{font-style:normal;width:22px;height:22px;line-height:20px;border-radius:50%;background:var(--gold);color:#121212;font-size:1rem;text-align:center}
.foot{margin-top:26px}
.contact{margin:0 0 22px}
.cl{margin-top:10px;display:grid;gap:8px}
.ct{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ct b{font-weight:600;letter-spacing:.5px}
.ct .btn{color:var(--text)}
.ct .btn.gold{color:#121212}
.qrs{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:0 0 22px;text-align:center;font-size:.85rem;color:var(--muted)}
.qrs div div{background:#fff;padding:8px;border-radius:8px;display:inline-block;line-height:0}
.qrs p{margin:6px 0 0}
.addr{background:var(--ink);color:#f1ece1;border:1px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:.92rem;text-align:center}
.addr small{display:block;color:#b9ae98;margin-top:4px;font-size:.78rem}
.upd{text-align:center;color:var(--muted);font-size:.85rem;margin:14px 0 0}
.ed-open{display:none;margin:12px auto 0;font:inherit;font-size:.85rem;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 16px;cursor:pointer}
.ed-open.on{display:block}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row.ed{grid-template-columns:1fr 6.5em 2rem;padding:6px 10px}
.in{width:100%;font:inherit;font-size:.95rem;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.in.pc{text-align:center}
.in.ttl{background:#1f1f1f;color:var(--gold);border-color:#5a4a22;font-family:var(--serif);font-size:1.1rem}
.x{font:inherit;line-height:1;width:2rem;height:2rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;cursor:pointer;flex:none}
.bar .x{border-color:#5a4a22;color:#d9b45a;margin-inline-start:auto}
.add{display:block;width:calc(100% - 20px);margin:8px 10px 10px;font:inherit;font-size:.9rem;color:var(--text);background:none;border:1px dashed var(--gold);border-radius:6px;padding:7px;cursor:pointer}
.addsec{margin:18px auto 0;width:100%;max-width:340px}
.pwbox{margin:0 0 18px;font-size:.9rem}
.savebar{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--ink);border-top:1px solid var(--gold);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));color:#f1ece1;font-size:.9rem}
.savebar button,.sheet .save2,.cancel2{font:inherit;font-weight:600;border-radius:999px;padding:7px 22px;cursor:pointer;border:1px solid var(--gold)}
.save{background:var(--gold);color:#121212}
.cancel{background:none;color:#f1ece1}
.cartbar{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;z-index:15;font:inherit;font-weight:600;font-size:1rem;background:var(--gold);color:#121212;border:0;border-radius:999px;padding:12px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
.shade{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.sm{max-width:380px;border-radius:16px;margin:auto}
.shade:has(.sm){align-items:center}
.sheet h2{font-family:var(--serif);color:var(--gold);margin:0 0 10px;font-size:1.5rem}
.sheet label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 0}
.sheet label .in{margin-top:3px;color:var(--text)}
.ln{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.lt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lf{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.tot{font-size:.9rem;margin:6px 0}
.geo{font-size:.82rem;color:var(--muted);margin:0}
.err{color:#c0392b;font-size:.85rem;margin:6px 0;min-height:1.2em}
.send{display:block;text-align:center;background:#25d366;color:#0b2a14;font-weight:600;text-decoration:none;border-radius:999px;padding:11px;margin-top:6px}
.cancel2{display:block;width:100%;margin-top:8px;background:none;color:var(--text);border-color:var(--line)}
.sheet .save2{background:var(--gold);color:#121212;width:100%;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="ovl"></div>
<script id="data" type="application/json">{"updated":"7 نوفمبر، 2026","sections":[{"flag":"🇮🇳","title":"اللحوم الهندية (مستورد)","items":[{"n":"كتف هندي","p":265},{"n":"سن هندي","p":250},{"n":"رقبه هندي","p":265},{"n":"ارباع هندي","p":237},{"n":"روزبيف هندي","p":255},{"n":"كولاطه هندي","p":255},{"n":"بوش هندي","p":null},{"n":"ظهر هندي","p":255},{"n":"انتركوت هندي","p":255},{"n":"سمانه هندي","p":281},{"n":"فلانك هندي","p":205},{"n":"عروق هندي","p":275},{"n":"وش هندي","p":285},{"n":"فلنو هندي","p":275},{"n":"فخده هندي","p":278},{"n":"قلب هندي","p":194}]},{"flag":"🇧🇷","title":"اللحوم البرازيلية","items":[{"n":"كتف برازيلي","p":296},{"n":"سن برازيلي","p":296},{"n":"رقبه برازيلي","p":290},{"n":"بوش برازيلي","p":null},{"n":"موزه امامي برازيلي","p":292},{"n":"موزه خلفي برازيلي","p":294},{"n":"عرق برازيلي","p":320},{"n":"سمانه برازيلي","p":315},{"n":"بريسكت برازيلي","p":270}]},{"flag":"🫀","title":"الكبدة والكلاوي والمصنعات","items":[{"n":"كبده سوفت 3D","p":170},{"n":"كبده سوفت 969","p":null},{"n":"كبده برازيلي","p":135},{"n":"كبده استرالي","p":154},{"n":"كلاوي برازيلي","p":92},{"n":"سحق النور","p":435},{"n":"سحق الدولية","p":325},{"n":"سحق الفارس","p":450}]}]}</script>
<script id="code">
var D = JSON.parse(document.getElementById('data').textContent);
var orig = JSON.stringify(D);
var editing=false, busy=false, note='', cartOpen=false, pw=null, cart=[];
var cust={name:'',phone:'',addr:'',loc:'',geo:''};
var app=document.getElementById('app'), ovl=document.getElementById('ovl');
var TITLE='ثلاجة التوحيد للحوم المجمدة | قائمة الأسعار';
var SITE=((location.protocol==='http:'||location.protocol==='https:')&&!/claude|anthropic/.test(location.hostname))?location.href.split('#')[0].split('?')[0]:'https://claude.ai/artifact/Sb8mR4EN6bQKYirxqWqBYp';
var ORDER='01121408000';
var CONTACTS=[
 {n:'المبيعات والاستعلام',p:'01121408000'},
 {n:'محمد حسين - المدير العام',p:'01121118177'},
 {n:'محمد حسين - المدير العام',p:'01223517000'},
 {n:'الخط الأرضي',p:'0237778145',land:1}];
function wa(p){return 'https://wa.me/20'+p.slice(1)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toEn(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
async function H(s){
  s='tawheed:'+s;
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  catch(e){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h}
}

function head(){
  return '<header class="top"><div class="hero" role="img" aria-label="شعار ثلاجة التوحيد"></div><div class="tin"><h1>ثلاجة التوحيد للحوم المجمدة</h1>'
   +'<a class="btn" href="tel:'+ORDER+'">اتصال</a><a class="btn gold" href="'+wa(ORDER)+'" target="_blank" rel="noopener">واتساب</a></div></header>'
   +'<span class="pill">قائمة الأسعار المحدثة / عرض أسعار</span>'
   +(editing?'':'<p class="hint">اضغط على أي صنف لإضافته إلى طلبك</p>');
}
function viewSec(s,si){
  return '<article class="card"><h2 class="bar"><span>'+esc(s.flag)+'</span>'+esc(s.title)+'</h2>'
   +'<div class="cols"><span>الصنف</span><span style="text-align:center">السعر (جنيه/كجم)</span></div>'
   +s.items.map(function(i,ii){
     if(i.p==null) return '<div class="row"><span>'+esc(i.n)+'</span><span class="pr na">غير متوفر</span></div>';
     return '<button type="button" class="row" data-act="add" data-s="'+si+'" data-i="'+ii+'" aria-label="إضافة '+esc(i.n)+' إلى الطلب"><span>'+esc(i.n)+'</span><span class="pr">'+esc(i.p)+'<i class="plus">+</i></span></button>';
   }).join('')+'</article>';
}
function editSec(s,si){
  return '<article class="card"><h2 class="bar"><input class="in ttl" aria-label="اسم القسم" data-s="'+si+'" data-f="t" value="'+esc(s.title)+'">'
   +'<button class="x" type="button" aria-label="حذف القسم" data-act="delsec" data-s="'+si+'">✕</button></h2>'
   +s.items.map(function(i,ii){
     return '<div class="row ed"><input class="in" aria-label="اسم الصنف" placeholder="اسم الصنف" data-s="'+si+'" data-i="'+ii+'" data-f="n" value="'+esc(i.n)+'">'
      +'<input class="in pc" aria-label="السعر بالجنيه" inputmode="decimal" placeholder="غير متوفر" data-s="'+si+'" data-i="'+ii+'" data-f="p" value="'+(i.p==null?'':esc(i.p))+'">'
      +'<button class="x" type="button" aria-label="حذف الصنف" data-act="delitem" data-s="'+si+'" data-i="'+ii+'">✕</button></div>';
   }).join('')
   +'<button class="add" type="button" data-act="additem" data-s="'+si+'">+ إضافة صنف</button></article>';
}
function contacts(){
  return '<section class="contact"><div class="card2" role="img" aria-label="بطاقة التواصل - محمد حسين المدير العام"></div><div class="cl">'
   +CONTACTS.map(function(c){
     return '<div class="ct"><span>'+esc(c.n)+'</span><b dir="ltr">'+c.p+'</b><span><a class="btn" href="tel:'+c.p+'">اتصال</a>'
      +(c.land?'':'<a class="btn gold" href="'+wa(c.p)+'" target="_blank" rel="noopener">واتساب</a>')+'</span></div>';
   }).join('')+'</div></section>'
   +'<section class="qrs"><div><div id="qr1"></div><p>امسح لفتح قائمة الأسعار</p></div><div><div id="qr2"></div><p>امسح للتواصل عبر واتساب</p></div></section>';
}
function render(){
  var h='<div class="wrap">'+head();
  if(editing) h+='<div class="pwbox"><label>تغيير كلمة المرور (اتركه فارغاً لعدم التغيير)<input class="in" id="npw" type="password" autocomplete="new-password"></label></div>';
  h+='<main class="grid">'+D.sections.map(function(s,i){return editing?editSec(s,i):viewSec(s,i)}).join('')+'</main>';
  if(editing) h+='<button class="add addsec" type="button" data-act="addsec">+ إضافة قسم جديد</button>';
  h+='<footer class="foot">'+(editing?'':contacts())
   +'<div class="addr">العنوان: 65 شارع المدارس القديم من الزهراء - العمرانية الغربية'
   +'<small>الأسعار قابلة للتغير حسب حركة السوق - جميع المنتجات مجمدة ومحفوظة وفق أعلى معايير الجودة والسلامة الغذائية</small></div>'
   +(D.updated?'<p class="upd">آخر تحديث للأسعار: '+esc(D.updated)+'</p>':'')
   +'<button class="ed-open'+(canEdit&&!editing?' on':'')+'" type="button" data-act="edit">تعديل الأسعار</button></footer></div>';
  if(editing) h+='<div class="savebar" role="region" aria-label="حفظ التعديلات"><span>'+esc(note||'عدّل الأسعار ثم اضغط حفظ ونشر')+'</span>'
   +'<button class="save" type="button" data-act="save"'+(busy?' disabled':'')+'>حفظ ونشر</button><button class="cancel" type="button" data-act="cancel">إلغاء</button></div>';
  app.innerHTML=h; renderOvl(); drawQR();
}
function drawQR(){
  if(!window.QRCode) return;
  [['qr1',SITE],['qr2',wa(ORDER)]].forEach(function(a){
    var el=document.getElementById(a[0]);
    if(el&&!el.firstChild){try{new QRCode(el,{text:a[1],width:128,height:128,correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
  });
}

function sheet(){
  var tot=0,hasT=false;
  cart.forEach(function(c){var k=parseFloat(c.kg);if(k>0){tot+=c.p*k*c.q;hasT=true}});
  return '<div class="shade" data-act="shade"><div class="sheet" role="dialog" aria-modal="true" aria-label="سلة الطلب"><h2>طلبك</h2>'
   +cart.map(function(c,k){
     return '<div class="ln"><div class="lt"><b>'+esc(c.n)+'</b><button class="x" type="button" aria-label="حذف" data-act="delline" data-k="'+k+'">✕</button></div>'
      +'<div class="lf"><label>عدد الكراتين<input class="in" type="number" min="1" inputmode="numeric" data-c="q" data-k="'+k+'" value="'+c.q+'"></label>'
      +'<label>وزن الكرتونة بالكيلو (اختياري)<input class="in" inputmode="decimal" data-c="kg" data-k="'+k+'" value="'+esc(c.kg)+'"></label></div></div>';
   }).join('')
   +(hasT?'<p class="tot">الإجمالي التقريبي للأصناف المحددة بالكيلو: <b>'+Math.round(tot).toLocaleString('en-US')+' جنيه</b></p>':'')
   +'<label>اسم العميل<input class="in" data-o="name" autocomplete="name" value="'+esc(cust.name)+'"></label>'
   +'<label>رقم هاتفك للتواصل معك عند تجهيز الطلب<input class="in" type="tel" inputmode="tel" data-o="phone" autocomplete="tel" value="'+esc(cust.phone)+'"></label>'
   +'<label>العنوان (اختياري)<input class="in" data-o="addr" autocomplete="street-address" value="'+esc(cust.addr)+'"></label>'
   +'<button class="add" type="button" data-act="geo" style="width:100%;margin:10px 0 4px">إضافة موقعي الحالي (اختياري)</button><p class="geo" id="geost">'+esc(cust.geo)+'</p>'
   +'<p class="err" id="err"></p><a class="send" id="send" href="#" target="_blank" rel="noopener" data-act="send">إرسال الطلب عبر واتساب</a>'
   +'<button class="cancel2" type="button" data-act="closecart">متابعة التسوق</button></div></div>';
}
function pwBox(){
  return '<div class="shade" data-act="shade"><div class="sheet sm" role="dialog" aria-modal="true"><h2>'+(pw.mode==='set'?'أنشئ كلمة مرور للتعديل':'أدخل كلمة المرور')+'</h2>'
   +'<input class="in" id="pw" type="password" aria-label="كلمة المرور" placeholder="كلمة المرور" autocomplete="'+(pw.mode==='set'?'new-password':'current-password')+'">'
   +'<p class="err">'+esc(pw.err||'')+'</p><button class="save2" type="button" data-act="pwok">تأكيد</button><button class="cancel2" type="button" data-act="pwno">إلغاء</button></div></div>';
}
function renderOvl(){
  document.body.className=(editing?'editing ':'')+(cart.length?'hascart':'');
  var h='';
  if(!editing&&cart.length&&!cartOpen&&!pw) h+='<button class="cartbar" type="button" data-act="opencart">سلة الطلب ('+cart.length+') - إتمام الطلب</button>';
  if(cartOpen) h+=sheet();
  if(pw) h+=pwBox();
  ovl.innerHTML=h;
  if(cartOpen) updSend();
  if(pw) setTimeout(function(){var p=document.getElementById('pw');if(p)p.focus()},30);
}

function buildMsg(){
  var L=['طلب جديد من قائمة الأسعار','','اسم العميل: '+cust.name.trim(),''];
  cart.forEach(function(c){
    var t=c.q+' كرتونة '+c.n;
    if(c.kg) t+=(c.q>1?' - الكرتونة ':' - ')+c.kg+' كيلو';
    L.push(t);
  });
  L.push('','رقم الهاتف: '+toEn(cust.phone).trim());
  if(cust.addr.trim()) L.push('العنوان: '+cust.addr.trim());
  if(cust.loc) L.push('الموقع: '+cust.loc);
  return L.join('\n');
}
function updSend(){
  var a=document.getElementById('send'); if(a) a.href=wa(ORDER)+'?text='+encodeURIComponent(buildMsg());
}

var canEdit=location.hash==='#edit';
if(window.claude&&claude.use){
  claude.use('user').then(function(u){
    if(u&&u.canEdit&&u.canEdit()&&!canEdit){canEdit=true;if(!editing&&!cartOpen&&!pw)render();}
  }).catch(function(){});
}

document.addEventListener('input',function(e){
  var t=e.target; if(!t.getAttribute) return;
  var c=t.getAttribute('data-c'), o=t.getAttribute('data-o'), f=t.getAttribute('data-f');
  if(c){
    var ln=cart[+t.getAttribute('data-k')]; if(!ln) return;
    if(c==='q') ln.q=Math.max(1,parseInt(toEn(t.value),10)||1); else ln.kg=toEn(t.value).replace(/[^\d.]/g,'');
    updSend(); return;
  }
  if(o){cust[o]=t.value;updSend();return;}
  if(!f) return;
  var s=D.sections[+t.getAttribute('data-s')]; if(!s) return;
  if(f==='t'){s.title=t.value;return;}
  var it=s.items[+t.getAttribute('data-i')]; if(!it) return;
  if(f==='n'){it.n=t.value;return;}
  var v=t.value.replace(/[^\d.]/g,''); it.p=v===''?null:Number(v);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='pw') pwok();
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]'); if(!b) return;
  var a=b.getAttribute('data-act'), si=+b.getAttribute('data-s'), ii=+b.getAttribute('data-i'), k=+b.getAttribute('data-k');
  if(a==='shade'){ if(e.target!==b) return; if(pw){pw=null}else{cartOpen=false} renderOvl(); }
  else if(a==='add'){
    var it=D.sections[si].items[ii], f=cart.filter(function(c){return c.n===it.n})[0];
    if(f) f.q++; else cart.push({n:it.n,p:it.p,q:1,kg:''});
    renderOvl();
  }
  else if(a==='opencart'){cartOpen=true;renderOvl();}
  else if(a==='closecart'){cartOpen=false;renderOvl();}
  else if(a==='delline'){cart.splice(k,1);if(!cart.length)cartOpen=false;renderOvl();}
  else if(a==='geo'){geo();}
  else if(a==='send'){
    updSend();
    var err=document.getElementById('err'), ph=toEn(cust.phone).replace(/[\s-]/g,'');
    var m='';
    if(!cust.name.trim()) m='اكتب اسم العميل';
    else if(!/^\+?\d{8,15}$/.test(ph)) m='اكتب رقم هاتف صحيح';
    if(m){e.preventDefault();err.textContent=m;} else err.textContent='';
  }
  else if(a==='edit'){pw={mode:D.ph?'ask':'set',err:''};renderOvl();}
  else if(a==='pwno'){pw=null;renderOvl();}
  else if(a==='pwok'){pwok();}
  else if(a==='cancel'){D=JSON.parse(orig);editing=false;note='';render();}
  else if(a==='additem'){D.sections[si].items.push({n:'',p:null});render();}
  else if(a==='delitem'){D.sections[si].items.splice(ii,1);render();}
  else if(a==='addsec'){D.sections.push({flag:'',title:'قسم جديد',items:[{n:'',p:null}]});render();}
  else if(a==='delsec'){D.sections.splice(si,1);render();}
  else if(a==='save'){save();}
});

function geo(){
  var st=document.getElementById('geost');
  if(!navigator.geolocation){cust.geo='تعذر تحديد الموقع، اكتب العنوان بدلاً منه';st.textContent=cust.geo;return;}
  st.textContent='جارٍ تحديد الموقع...';
  navigator.geolocation.getCurrentPosition(function(p){
    cust.loc='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);
    cust.geo='تمت إضافة موقعك إلى الطلب'; st.textContent=cust.geo; updSend();
  },function(){
    cust.geo='تعذر تحديد الموقع، اكتب العنوان بدلاً منه'; st.textContent=cust.geo;
  },{timeout:10000});
}
async function pwok(){
  var v=document.getElementById('pw').value;
  if(pw.mode==='set'){
    if(v.length<4){pw.err='اكتب 4 أحرف أو أرقام على الأقل';renderOvl();return;}
    D.ph=await H(v);
  }else if(await H(v)!==D.ph){pw.err='كلمة المرور غير صحيحة';renderOvl();return;}
  pw=null;editing=true;note='';render();
}

function buildDoc(d){
  var j=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n'
   +'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
   +'<title>'+TITLE+'</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n'
   +'<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">\n'
   +'<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>\n'
   +'<style id="css">'+document.getElementById('css').textContent+'</style>\n</head>\n<body>\n<div id="app"></div>\n<div id="ovl"></div>\n'
   +'<script id="data" type="application/json">'+j+'<\/script>\n'
   +'<script id="code">'+document.getElementById('code').textContent+'<\/script>\n</body>\n</html>';
}
function dl(html){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();}
async function save(){
  if(busy) return;
  var np=document.getElementById('npw');
  if(np&&np.value){
    if(np.value.length<4){note='كلمة المرور 4 أحرف على الأقل';render();return;}
    D.ph=await H(np.value);
  }
  D.sections.forEach(function(s){s.items=s.items.filter(function(i){return String(i.n).trim()!==''})});
  D.updated=new Date().toLocaleDateString('ar-EG-u-nu-latn',{year:'numeric',month:'long',day:'numeric'});
  busy=true;note='جارٍ الحفظ...';render();
  try{
    var art=window.claude&&await claude.use('artifact');
    if(!art){dl(buildDoc(D));orig=JSON.stringify(D);busy=false;note='تم تنزيل الملف index.html، ارفعه على الاستضافة ليظهر للزبائن';render();return;}
    await art.publish(buildDoc(D));
  }catch(err){
    busy=false;var c=err&&err.code;
    note=(c==='not_writer'||c==='not_granted'||c==='none')?'التعديل متاح لصاحب الصفحة فقط':'تعذّر الحفظ، حاول مرة أخرى';
    render();
  }
}
render();
</script>
</body>
</html>
